# Every push to main: build the site from the sources, run the checks and publish it on GitHub Pages
# (https://hinoob13031997.github.io/skroll/). If the checks fail, the live site stays as it was.
name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Сборка и проверка
        run: node build.mjs && node check.mjs && node tools/check-gummies.mjs && node tools/check-gummy-interaction.mjs
      - name: Сборка под адрес GitHub Pages
        run: node build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
